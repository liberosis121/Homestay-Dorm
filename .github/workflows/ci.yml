name: Continuous Integration (CI)

on:
  push:
    branches: [ main, triduc-dev, nhatanh-dev, usuk-dev, kyen-dev, triduc-fe ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code từ GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js phiên bản 20
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup pnpm (trình quản lý package của dự án)
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      # 4. Cấu hình Cache cho pnpm để tăng tốc những lần chạy sau
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # 5. Cài đặt toàn bộ dependencies trong monorepo
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 6. Kiểm tra lỗi kiểu dữ liệu TypeScript (Typecheck)
      - name: Run Typecheck
        run: pnpm typecheck

      # 7. Biên dịch thử dự án (Build Check)
      - name: Build Projects
        run: pnpm build
